<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | SRU Campus Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>

  <header class="site-header">
    <div class="navbar">
      <a href="homepage.html" class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/></svg>
        </span>
        <span class="logo-text">SRU Campus Cart</span>
      </a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 class="auth-title" id="login-title">Log in</h1>
      <p class="auth-subtitle">Welcome back! Log in to order from campus stores.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com"
                 autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password"
                 autocomplete="current-password" required>
        </div>

        <label class="show-password">
          <input type="checkbox" id="show-password"> Show password
        </label>

        <button type="submit" class="auth-button" id="login-button">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
